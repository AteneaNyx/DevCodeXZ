<svg width="500" height="245" viewBox="0 0 500 245" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub Stats">
  <style>
    .lbl { font: 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a9b1d6; }
    .val { font: bold 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
    .ttl { font: bold 19px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7aa2f7; }
  </style>
  <rect x="0.5" y="0.5" width="499" height="244" rx="12" fill="#1a1b27" stroke="#3b4261"/>

  <polygon points="30,30 35.2,40.8 47,42.4 38.5,50.6 40.5,62.3 30,56.7 19.5,62.3 21.5,50.6 13,42.4 24.8,40.8" fill="#f7cf5a"/>
  <text x="58" y="48" class="ttl">DevCode Kawai's GitHub Stats</text>
  <line x1="24" y1="66" x2="476" y2="66" stroke="#2f334d" stroke-width="1.5"/>

  <g transform="translate(26,84)">
    <rect x="0" y="0" width="18" height="16" rx="2.5" fill="none" stroke="#00d2ff" stroke-width="2"/>
