      <stop offset="0.5" stop-color="#00d2ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#00d2ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d4edd" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9d4edd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9d4edd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="a3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7bf1a8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7bf1a8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7bf1a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="a4" x1="0" y1="0" x2="1" y2="0">
