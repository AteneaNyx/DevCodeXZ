    <circle cx="340" cy="35" r="1.2" opacity="0.4"/>
    <circle cx="560" cy="75" r="1.8" opacity="0.6"/>
    <circle cx="820" cy="30" r="1.3" opacity="0.45"/>
    <circle cx="1060" cy="65" r="1.7" opacity="0.55"/>
